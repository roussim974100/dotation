<!DOCTYPE html>
<html>
<head>
    <title>Lock Test - Pierre's Form</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .card { background: white; padding: 20px; margin: 10px 0; border-radius: 5px; }
        .locked { color: green; font-weight: bold; }
        .unlocked { color: red; font-weight: bold; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #ddd; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Lock State Test</h1>

    <div class="card">
        <h2>Server Status</h2>
        <p id="server-status">Loading...</p>
    </div>

    <div class="card">
        <h2>Frontend Lock State</h2>
        <p id="form-status">Open form and check lock state...</p>
        <button onclick="checkFormLock()">Check Lock State</button>
        <pre id="lock-details"></pre>
    </div>

    <script src="/api/debug/test.js"></script>
</body>
</html>
