name: Tests

on:
  push:
    branches: [dev, preprod, main, prod]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r backend/requirements.txt
      - name: Tests (bases temporaires, aucune vraie base touchée)
        run: python -m pytest tests -q
